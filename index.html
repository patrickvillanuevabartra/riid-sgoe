<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>RID-SGOE — nueva dirección</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="canonical" href="https://patrickvillanuevabartra.github.io/rid-sgoe/">
<meta http-equiv="refresh" content="0; url=https://patrickvillanuevabartra.github.io/rid-sgoe/">
<style>
  :root{--brand:#0f8f5e;--brand-oscuro:#0b6e48;--tinta:#1a1f1d;--tenue:#5b6a63;--linea:#dbe4e0}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--tinta);background:#f4f7f6}
  .caja{max-width:520px;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:34px 30px;text-align:center}
  .sello{width:52px;height:52px;margin:0 auto 18px;border-radius:12px;background:var(--brand);color:#fff;
    display:grid;place-items:center;font-weight:700;letter-spacing:.06em;font-size:15px}
  h1{font-size:21px;margin:0 0 10px}
  p{margin:0 0 18px;line-height:1.6;color:var(--tenue);font-size:15.5px}
  a.btn{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;font-weight:600;
    padding:11px 22px;border-radius:9px}
  a.btn:hover{background:var(--brand-oscuro)}
  .nota{margin-top:20px;font-size:13.5px;color:var(--tenue)}
</style>
</head>
<body>
  <div class="caja">
    <div class="sello">RID</div>
    <h1>El repositorio cambió de dirección</h1>
    <p>El Repositorio de Información Documentada del SGOE ahora vive en una dirección nueva.
       Te estamos llevando allá automáticamente.</p>
    <a class="btn" href="https://patrickvillanuevabartra.github.io/rid-sgoe/">Ir al repositorio</a>
    <div class="nota">Actualiza tu marcador: la dirección antigua dejará de usarse.</div>
  </div>
  <script>location.replace('https://patrickvillanuevabartra.github.io/rid-sgoe/');</script>
</body>
</html>
