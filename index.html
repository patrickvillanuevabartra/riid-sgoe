<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIID — Repositorio de Información Documentada · SGOE ISO 21001 · FI URP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --brand:#0f8f5e;--brand-oscuro:#0b6e48;--brand-suave:#e6f4ee;
  --tinta:#15201b;--tinta-media:#5a6660;--tinta-tenue:#8c948f;
  --linea:#dfe4e1;--fondo:#f6f8f7;--papel:#fff;
  --ok:#0f8f5e;--parcial:#b8860b;--parcial-suave:#fbf3dc;--falla:#c0392b;--falla-suave:#fbe9e7;
  --azul:#2f5f8a;--azul-suave:#e8eff6;--radio:8px;
}
*{box-sizing:border-box}
html{zoom:1.22}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.5}
.mono{font-family:'IBM Plex Mono',monospace}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
a{color:var(--brand)}
.oculto{display:none!important}

header{background:var(--papel);border-bottom:1px solid var(--linea);padding:10px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:30}
.sello{width:max-content;min-width:44px;height:30px;padding:0 6px;border-radius:6px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:11.5px;letter-spacing:.02em;flex:none;font-family:'IBM Plex Mono',monospace}
.marca{display:flex;flex-direction:column;line-height:1.2}
.marca b{font-size:14px;font-weight:600}
.marca span{font-size:11px;color:var(--tinta-media)}
.espacio{flex:1}
.usuario{text-align:right;line-height:1.25}
.usuario b{display:block;font-size:12px;font-weight:600}
.usuario span{font-size:11px;color:var(--tinta-media)}

nav.pestanas{background:var(--papel);border-bottom:1px solid var(--linea);padding:0 20px;display:flex;gap:4px;overflow-x:auto;position:sticky;top:51px;z-index:25}
nav.pestanas button{border:0;background:none;padding:11px 12px;color:var(--tinta-media);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav.pestanas button.activa{color:var(--brand);border-bottom-color:var(--brand)}
.contador{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--parcial);color:#fff;font-size:11px;line-height:18px;text-align:center}

main{max-width:1240px;margin:0 auto;padding:20px}
.titulo-seccion{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.titulo-seccion h2{font-size:18px}
.titulo-seccion p{margin:2px 0 0;color:var(--tinta-media);font-size:12.5px}

.btn{text-decoration:none;border:1px solid var(--brand);background:var(--brand);color:#fff;padding:7px 14px;border-radius:var(--radio);font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--brand-oscuro)}
.btn.g{background:transparent;color:var(--brand)}
.btn.g:hover{background:var(--brand-suave)}
.btn.n{background:transparent;color:var(--tinta-media);border-color:var(--linea)}
.btn.rojo{background:var(--falla);border-color:var(--falla)}
.btn.ambar{background:var(--parcial);border-color:var(--parcial)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.caja{background:var(--papel);border:1px solid var(--linea);border-radius:10px;padding:16px}
.caja h3{font-size:13.5px;margin-bottom:10px}
.rejilla{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}}

.cifras{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--linea);border-radius:10px;background:var(--papel);margin-bottom:14px}
.cifras div{padding:12px 14px;border-right:1px solid var(--linea)}
.cifras div:last-child{border-right:0}
.cifras b{display:block;font-size:22px;font-weight:600;font-family:'IBM Plex Mono',monospace}
.cifras span{font-size:11px;color:var(--tinta-media);text-transform:uppercase;letter-spacing:.04em}
@media(max-width:900px){.cifras{grid-template-columns:repeat(3,1fr)}}

.barra-filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input[type=text],input[type=url],input[type=email],input[type=date],input[type=number],select,textarea{border:1px solid var(--linea);border-radius:6px;padding:7px 9px;background:var(--papel);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-suave);border-color:var(--brand)}
textarea{width:100%;min-height:70px;resize:vertical}
.buscar{flex:1;min-width:220px}

.tabla-envoltura{overflow-x:auto;border:1px solid var(--linea);border-radius:10px;background:var(--papel)}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:#fafbfa;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--tinta-media);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--linea);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #eef1ef;vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.clic{cursor:pointer}
tbody tr.clic:hover{background:#f8fbf9}
.cod{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:500;white-space:nowrap}
.sub{font-size:12px;color:var(--tinta-media)}
.vacio{padding:26px;text-align:center;color:var(--tinta-tenue)}

.eti{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.e-vigente{background:var(--brand-suave);color:var(--brand-oscuro)}
.e-obsoleto{background:#eee;color:#666;text-decoration:line-through}
.e-flujo{background:var(--azul-suave);color:var(--azul)}
.e-observada{background:var(--parcial-suave);color:#8a6508}
.e-rechazada{background:var(--falla-suave);color:var(--falla)}
.e-neutra{background:#f1f3f2;color:var(--tinta-media)}
.e-vencida{background:var(--falla-suave);color:var(--falla)}
.e-proxima{background:var(--parcial-suave);color:#8a6508}
.e-restringida{border-color:var(--linea);color:var(--tinta-media)}

.barras .fila{display:grid;grid-template-columns:150px 1fr 34px;gap:8px;align-items:center;margin:6px 0;font-size:12.5px}
.barras .pista{height:8px;background:#eef1ef;border-radius:4px;overflow:hidden}
.barras .relleno{height:100%;background:var(--brand)}
.barras .num{font-family:'IBM Plex Mono',monospace;text-align:right}

.lista-tareas .tarea{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #eef1ef;cursor:pointer}
.lista-tareas .tarea:last-child{border-bottom:0}
.lista-tareas .tarea:hover .t-tit{color:var(--brand)}
.t-tit{font-weight:500}

/* modales */
.velo{position:fixed;inset:0;background:rgba(21,32,27,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;overflow-y:auto}
.modal{background:var(--papel);border-radius:12px;width:100%;max-width:760px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal.ancho{max-width:1180px}
.modal-cab{display:flex;align-items:flex-start;gap:12px;padding:14px 18px;border-bottom:1px solid var(--linea)}
.modal-cab h2{font-size:16px}
.modal-cuerpo{padding:16px 18px}
.modal-pie{padding:12px 18px;border-top:1px solid var(--linea);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.cerrar{border:0;background:none;font-size:22px;line-height:1;color:var(--tinta-tenue);padding:0 4px}

.campos{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.campos .completo{grid-column:1/-1}
.campo label{display:block;font-size:13px;font-weight:600;color:var(--tinta);margin-bottom:4px}
.campo input,.campo select{width:100%}
.campo .ayuda{font-size:11.5px;color:var(--tinta-tenue);margin-top:2px}
.req::after{content:' *';color:var(--falla)}
@media(max-width:700px){.campos{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--linea);border-radius:14px;padding:3px 10px;font-size:12.5px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--tinta);cursor:pointer}
.chips input,.campo .chips input{margin:0;width:auto;flex:none}
.codigo-previo{display:flex;align-items:center;gap:10px;background:var(--brand-suave);border-radius:8px;padding:9px 12px;margin-bottom:12px}
.codigo-previo b{font-family:'IBM Plex Mono',monospace;font-size:15px}

/* ficha del documento */
.ficha{display:grid;grid-template-columns:1.35fr 1fr;min-height:560px}
@media(max-width:980px){.ficha{grid-template-columns:1fr}}
.visor{background:#e9ecea;border-right:1px solid var(--linea);display:flex;flex-direction:column}
.visor-banda{display:flex;align-items:center;gap:10px;padding:7px 12px;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--brand)}
.visor-banda.obsoleto{background:var(--falla)}
.visor-marco{position:relative;flex:1;min-height:520px}
.visor-marco iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.marca-agua{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.marca-agua.obsoleto{background:repeating-linear-gradient(-45deg,rgba(192,57,43,.07) 0 18px,transparent 18px 36px)}
.marca-agua span{position:absolute;top:45%;left:-10%;right:-10%;text-align:center;transform:rotate(-28deg);font-weight:700;font-size:54px;color:rgba(192,57,43,.18);letter-spacing:.1em}
.sin-archivo{display:grid;place-items:center;height:100%;color:var(--tinta-tenue);text-align:center;padding:30px}
.panel{display:flex;flex-direction:column;min-width:0}
.subpestanas{display:flex;border-bottom:1px solid var(--linea);padding:0 12px}
.subpestanas button{border:0;background:none;padding:10px;color:var(--tinta-media);border-bottom:2px solid transparent;font-weight:500;font-size:13px}
.subpestanas button.activa{color:var(--brand);border-bottom-color:var(--brand)}
.panel-cuerpo{padding:14px 16px;overflow-y:auto;max-height:600px}
dl.meta{display:grid;grid-template-columns:150px 1fr;gap:6px 10px;margin:0;font-size:13px}
dl.meta dt{color:var(--tinta-media);font-size:12px}
dl.meta dd{margin:0;word-break:break-word}
.linea-tiempo{border-left:2px solid var(--linea);margin-left:6px;padding-left:14px}
.hito{position:relative;margin-bottom:12px}
.hito::before{content:'';position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--papel);border:2px solid var(--brand)}
.hito.vigente::before{background:var(--brand)}
.hito .h-cab{font-size:12.5px}
.hito .h-txt{font-size:13px;margin-top:2px;white-space:pre-wrap}
.nota{border:1px solid var(--linea);border-radius:8px;padding:9px 11px;margin-bottom:8px}
.nota .n-cab{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--tinta-media);flex-wrap:wrap}
.nota .n-txt{margin-top:4px;white-space:pre-wrap}
.nota .n-resp{margin-top:6px;border-left:3px solid var(--brand);padding-left:8px;font-size:12.5px;color:var(--tinta-media)}
.aviso-caja{border-left:3px solid var(--parcial);background:var(--parcial-suave);padding:8px 12px;border-radius:0 6px 6px 0;font-size:12.5px;margin-bottom:10px}
.aviso-caja.info{border-color:var(--azul);background:var(--azul-suave)}
.cambio{background:#fff8e1}

/* acceso */
.acceso{min-height:calc(100vh/1.22);display:grid;place-items:center;padding:20px}
.acceso .caja{max-width:470px;width:100%;padding:28px}
.acceso h1{font-size:20px;margin:14px 0 6px}
.acceso p{color:var(--tinta-media);font-size:13px;margin:0 0 18px}

#carga{position:fixed;inset:0;background:rgba(246,248,247,.7);z-index:80;display:grid;place-items:center}
.carga-caja{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:360px;text-align:center}
.carga-texto{font-size:13px;color:var(--tinta-media);line-height:1.5}
.giro{width:30px;height:30px;border:3px solid var(--brand-suave);border-top-color:var(--brand);border-radius:50%;animation:g 0.8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
#avisos{position:fixed;bottom:18px;right:18px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--tinta);color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;max-width:380px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.toast.error{background:var(--falla)}

/* bombitas de ayuda */
.ayuda{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--linea);color:var(--tinta-media);font:600 10px/1 'IBM Plex Sans',sans-serif;cursor:help;position:relative;vertical-align:middle;margin-left:5px}
.ayuda:hover{background:var(--brand);color:#fff}
.ayuda::after{content:attr(data-tip);position:absolute;bottom:150%;left:50%;transform:translateX(-50%);background:var(--brand-oscuro);color:#fff;padding:9px 11px;border-radius:7px;width:265px;font:400 12px/1.45 'IBM Plex Sans',sans-serif;text-transform:none;letter-spacing:0;text-align:left;box-shadow:0 8px 20px rgba(0,0,0,.22);opacity:0;visibility:hidden;transition:opacity .12s;z-index:120;pointer-events:none}
.ayuda::before{content:'';position:absolute;bottom:135%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--brand-oscuro);opacity:0;visibility:hidden;z-index:120}
.ayuda:hover::after,.ayuda:hover::before{opacity:1;visibility:visible}
.ayuda.abajo::after{bottom:auto;top:150%}
.ayuda.abajo::before{bottom:auto;top:135%;border-top-color:transparent;border-bottom-color:var(--brand-oscuro)}

/* tira del flujo */
.flujo{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin-bottom:14px;border:1px solid var(--linea);border-radius:10px;background:var(--papel);overflow:hidden}
.flujo .paso{flex:1;min-width:150px;padding:10px 12px 10px 22px;position:relative;border-right:1px solid var(--linea)}
.flujo .paso:last-child{border-right:0}
.flujo .paso:not(:first-child)::before{content:'';position:absolute;left:-1px;top:50%;width:14px;height:14px;background:var(--papel);border-top:1px solid var(--linea);border-right:1px solid var(--linea);transform:translateY(-50%) rotate(45deg);z-index:2}
.flujo .paso b{display:block;font-size:12.5px}
.flujo .paso span{font-size:11.5px;color:var(--tinta-media);line-height:1.35;display:block;margin-top:2px}
.flujo .paso .quien{display:inline-block;margin-top:4px;font-size:11px;color:var(--brand-oscuro);background:var(--brand-suave);border-radius:9px;padding:1px 7px}
.flujo .paso.activo{background:var(--brand-suave)}
.flujo .paso.activo b{color:var(--brand-oscuro)}
.flujo .paso.activo:not(:first-child)::before{background:var(--brand-suave)}

.comose{border:1px solid var(--linea);border-left:3px solid var(--brand);background:var(--papel);border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:14px}
.comose > b{font-size:12.5px;display:block;margin-bottom:4px}
.comose ol{margin:0;padding-left:18px}
.comose li{font-size:12.5px;color:var(--tinta-media);margin:3px 0;line-height:1.45}
.comose li b,.comose li strong{color:var(--tinta)}

.cascada{display:flex;flex-direction:column;gap:8px}
.casc-nivel label{display:block;font-size:12.5px;font-weight:600;color:var(--tinta-media);margin-bottom:3px}
.casc-nivel select{width:100%}
.casc-ruta{border:1px dashed var(--brand);border-radius:6px;padding:7px 10px;font-size:12.5px;background:var(--brand-suave)}
.sec-form{font-size:13px;margin:18px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--linea);color:var(--brand-oscuro)}
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.subnav button{border:1px solid var(--linea);background:var(--papel);border-radius:16px;padding:5px 12px;font-size:12.5px;color:var(--tinta-media)}
.subnav button.activa{background:var(--brand);border-color:var(--brand);color:#fff}
.candado{font-size:10px;opacity:.7}
.finalidad{font-size:12.5px;color:var(--tinta-media);line-height:1.5}
.finalidad b{color:var(--tinta)}
.nota-campo{font-size:11.5px;color:var(--tinta-media);margin-top:4px;line-height:1.45;padding-left:9px;border-left:2px solid var(--linea)}
.nota-campo.origen{border-left-color:var(--azul);background:var(--azul-suave);padding:6px 9px;border-radius:0 5px 5px 0}
.nota-campo b{color:var(--tinta)}
.nota-campo .ir{font-weight:600;white-space:nowrap}
.req-previo{margin-bottom:3px}
.lista-vacia{margin-top:6px;padding:6px 8px;border-radius:5px;background:var(--parcial-suave);color:#6d4f06;border:1px solid #efd9a0}
.lista-vacia b{color:#6d4f06}

/* puesta en marcha */
.marcha{background:var(--papel);border:1px solid var(--linea);border-radius:10px;padding:12px 16px;margin-bottom:14px}
.marcha h3{font-size:13.5px;margin:0 0 4px}
.marcha .sub{margin-bottom:8px}
.marcha .paso-m{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #eef1ef}
.marcha .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.marcha .ic.ok{background:var(--brand-suave);color:var(--brand-oscuro)}
.marcha .ic.no{background:var(--parcial-suave);color:#8a6508}
.marcha .tx b{display:block;font-size:13px}
.marcha .tx span{font-size:12px;color:var(--tinta-media)}
.ficha-campos{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
@media(max-width:700px){.ficha-campos{grid-template-columns:1fr}}
.fc-et{font-size:12.5px;font-weight:600;color:var(--tinta-media)}
.fc-val{font-size:13px;margin-top:2px;word-break:break-word}

.guia h3{font-size:14px;margin:18px 0 6px}
.guia h3:first-child{margin-top:0}
.guia p,.guia li{font-size:13px;color:var(--tinta);margin:4px 0}
.guia ul{margin:4px 0;padding-left:18px}
.pasoguia{display:flex;gap:10px;margin:8px 0}
.pasoguia .num{flex:none;width:22px;height:22px;border-radius:50%;background:var(--brand-suave);color:var(--brand-oscuro);display:grid;place-items:center;font:600 12px/1 'IBM Plex Mono',monospace}
.pasoguia .tit{display:block;font-size:13px;font-weight:600}
.pasoguia p{margin:2px 0 0;font-size:12.5px;color:var(--tinta-media)}
.guia .fuente{display:grid;grid-template-columns:150px 1fr;gap:4px 10px;font-size:12.5px;margin:6px 0}
.guia .fuente dt{color:var(--tinta-media)}
.guia .fuente dd{margin:0}

/* asistente */
.asis-boton{position:fixed;right:18px;bottom:18px;z-index:70;border:0;border-radius:22px;background:var(--brand);color:#fff;padding:10px 18px;font-weight:600;font-size:14px;box-shadow:0 6px 18px rgba(15,143,94,.35)}
.asis-boton:hover{background:var(--brand-oscuro)}
.asis-panel{position:fixed;right:18px;bottom:66px;z-index:75;width:390px;max-width:calc(100vw - 36px);height:min(560px, calc(100vh/1.22 - 100px));background:var(--papel);border:1px solid var(--linea);border-radius:12px;box-shadow:0 18px 44px rgba(0,0,0,.2);display:flex;flex-direction:column;overflow:hidden}
.asis-cab{display:flex;align-items:flex-start;gap:8px;padding:11px 14px;background:var(--brand);color:#fff}
.asis-cab div{flex:1;line-height:1.25}
.asis-cab b{display:block;font-size:14px}
.asis-cab span{font-size:11px;opacity:.85}
.asis-cab .cerrar{color:#fff}
.asis-cuerpo{flex:1;overflow-y:auto;padding:12px;background:var(--fondo)}
.asis-msg{max-width:88%;padding:8px 11px;border-radius:10px;margin-bottom:8px;font-size:13px;line-height:1.5;word-wrap:break-word}
.asis-msg p{margin:0 0 6px}.asis-msg p:last-child{margin:0}
.asis-msg ol,.asis-msg ul{margin:4px 0 6px;padding-left:18px}
.asis-msg li{margin:2px 0}
.asis-msg.asistente{background:var(--papel);border:1px solid var(--linea)}
.asis-msg.usuario{background:var(--brand-suave);margin-left:auto}
.asis-msg.error{border-color:var(--falla);background:var(--falla-suave)}
.asis-escribiendo{color:var(--tinta-tenue);font-style:italic}
.asis-sugeridas{display:flex;flex-direction:column;gap:5px;margin-top:4px}
.asis-sugeridas button{text-align:left;border:1px solid var(--linea);background:var(--papel);border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--brand-oscuro)}
.asis-sugeridas button:hover{border-color:var(--brand)}
.asis-adjunto{display:flex;align-items:center;gap:8px;padding:6px 12px;border-top:1px solid var(--linea);font-size:12px}
.asis-adjunto img{height:34px;border-radius:4px;border:1px solid var(--linea)}
.asis-adjunto span{flex:1;color:var(--tinta-media)}
.asis-adjunto button{border:0;background:none;color:var(--falla);font-size:12px}
.asis-pie{display:flex;gap:6px;align-items:flex-end;padding:9px 10px;border-top:1px solid var(--linea)}
.asis-pie textarea{flex:1;min-height:38px;max-height:120px;resize:none;font-size:13px}
.asis-clip{cursor:pointer;font-size:18px;padding:6px 2px}
.asis-mic{border:0;background:none;font-size:18px;padding:6px 2px;border-radius:50%;line-height:1}
.asis-mic.escuchando{background:var(--falla);animation:latido 1s ease-in-out infinite}
@keyframes latido{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.55)}50%{box-shadow:0 0 0 7px rgba(192,57,43,0)}}
.asis-voz{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:6px;font-size:15px;padding:3px 7px;margin-right:2px}
.asis-voz.activa{background:rgba(255,255,255,.35)}
.asis-msg.leyendo{border-left:3px solid var(--brand)}
.asis-nota{font-size:10.5px;color:var(--tinta-tenue);padding:0 12px 8px;line-height:1.35}
@media print{.asis-boton,.asis-panel{display:none!important}}

.solo-impresion{display:none}

  html{zoom:1}
  header,nav,.no-imprimir,#avisos,.modal-pie,.visor,.subpestanas{display:none!important}

  .modal{box-shadow:none}

}

<body>

<section id="pantallaAcceso" class="acceso">
  <div class="caja">
    <div class="sello">RIID</div>
    <h1>Repositorio Institucional de Información Documentada</h1>

    <div id="botonGoogle"></div>

<script>
'use strict';
const CFG = window.RIID_CONFIG;
/* Versión mínima del Apps Script (Codigo.gs) que necesita esta página.
   Si el publicado es más antiguo, se avisa al administrador cómo actualizarlo. */
const BACKEND_ESPERADO = '2026-09-25';
const PASOS_PUBLICAR = 'En script.google.com abre el proyecto del RIID, pega el Codigo.gs nuevo, guarda y ve a <b>Implementar → Administrar implementaciones → ✏️ (lápiz) → Versión: «Nueva versión» → Implementar</b>. La URL no cambia, así que no hay que tocar el Worker. Guardar el código no basta: Google sigue ejecutando la versión implementada hasta que publicas una nueva.';
const CLAUSULAS = ['4 Contexto','5 Liderazgo','6 Planificación','7 Apoyo','7.5 Información documentada','8 Operación','9 Evaluación del desempeño','10 Mejora'];
const TIPOS_OBS = ['Observación','Recomendación','Oportunidad de mejora','No conformidad','Conformidad'];
const DISPOSICION = ['Evaluar al vencer','Eliminar','Transferir a archivo central','Conservación permanente'];

let S = { cred:'', perfil:null, cat:null, cand:null, docs:[], sols:[], obsAbiertas:{}, totalReg:0, hoy:'', prefijo:'FI', registros:null, vista:'tablero' };
const F = { q:'', tipo:'', macro:'', proceso:'', programa:'', estado:'Vigente' };
const FR = { q:'', formato:'', programa:'', periodo:'' };

/* ------------------------------------------------------------ utilidades */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fechaCorta = f => { const m = /^(\d{4})-(\d{2})-(\d{2})(.*)$/.exec(f||''); return m ? `${m[3]}/${m[2]}/${m[1]}${m[4]}` : (f||'—'); };
const opciones = (lista, sel, vacio) => (vacio!==undefined?`<option value="">${esc(vacio)}</option>`:'') + lista.map(o => {
  const v = typeof o === 'string' ? o : o.v, t = typeof o === 'string' ? o : o.t;
  return `<option value="${esc(v)}"${v===sel?' selected':''}>${esc(t)}</option>`; }).join('');
const diasEntre = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);

/* Desplegable de procesos agrupado por tipo de macroproceso (inventario) */
function opcionesProcesos(lista, sel){
  const grupos = {};
  lista.forEach(p => { (grupos[p.tipo || p.grupo || 'Procesos'] ||= []).push(p); });
  return '<option value="">Seleccione</option>' + Object.keys(grupos).map(g =>
    `<option disabled>── ${esc(g)} ──</option>` + grupos[g].map(p => {
      const extra = p.grupo && p.grupo !== p.nombre ? ` (${p.grupo})` : '';
      return `<option value="${esc(p.codigo)}"${p.codigo===sel?' selected':''}>${esc(p.codigo)} · ${esc(p.nombre)}${esc(extra)}</option>`;
    }).join('')).join('');
}
const tip = (t, abajo) => `<span class="ayuda${abajo?' abajo':''}" data-tip="${esc(t)}">?</span>`;

const PASOS = [
  ['Elaboración','Pestaña «Lista maestra» → botón «+ Solicitar nuevo documento». Si el documento ya existe, ábrelo y usa «Solicitar modificación».','Lo hace: responsable del proceso'],
  ['Revisión','Pestaña «Flujo documental» → «Mis pendientes» → clic en la solicitud → botón «Revisión conforme» u «Observar».','Lo hace: el revisor que se eligió'],
  ['Aprobación','Pestaña «Flujo documental» → «Mis pendientes» → clic en la solicitud → escribe la resolución o acta → «Aprobar y publicar».','Lo hace: el aprobador que se eligió'],
  ['Vigente','El documento aparece en «Lista maestra» con su código y versión; la versión anterior pasa a obsoleta.','Lo consulta: toda la Facultad']
];
/* Caja de instrucciones paso a paso que encabeza cada pestaña */
function comoSeUsa(titulo, pasos){
  return `<div class="comose"><b>${esc(titulo)}</b><ol>${pasos.map(x=>`<li>${x}</li>`).join('')}</ol></div>`;
}

function tiraFlujo(activo){
  return `<div class="flujo">${PASOS.map((p,i)=>`<div class="paso ${i===activo?'activo':''}">
    <b>${i+1}. ${esc(p[0])}</b><span>${esc(p[1])}</span><span class="quien">${esc(p[2])}</span></div>`).join('')}</div>`;
}

function guiaRapida(){
  const c = S.cat, p = S.perfil;
  const paso = (n, t, cuerpo) => `<div class="pasoguia"><div class="num">${n}</div><div><span class="tit">${t}</span>${cuerpo}</div></div>`;
  modal(`<div class="modal-cab"><div style="flex:1"><div class="sub">Guía de uso</div><h2>Cómo funciona el repositorio, paso a paso</h2></div><button class="cerrar" onclick="cerrarModal()">×</button></div>
  <div class="modal-cuerpo guia">
    <div class="aviso-caja info">En una frase: <b>los documentos se proponen, alguien los revisa, alguien los aprueba y recién entonces quedan vigentes</b>. Todo ocurre dentro de este aplicativo; el archivo en sí vive en Google Drive.</div>

    <h3>A. Quiero leer un documento (todos)</h3>
    ${paso(1,'Entra a la pestaña «Lista maestra»','<p>Es el índice oficial de todos los documentos del SGOE.</p>')}
    ${paso(2,'Busca o filtra','<p>Escribe el nombre en el buscador, o usa los filtros de tipo, proceso y programa.</p>')}
    ${paso(3,'Haz clic en la fila','<p>Se abre la ficha: a la izquierda el documento para leerlo, a la derecha sus datos, versiones y observaciones. Lo que imprimas es copia no controlada.</p>')}

    <h3>B. Quiero crear un documento nuevo${p.puede.solicitar?'':' (necesitas rol de responsable de proceso)'}</h3>
    ${paso(1,'Prepara el borrador en Google Drive','<p>Sube el archivo y compártelo con el dominio <b>urp.edu.pe</b> como lector. Copia el enlace: sin eso, el revisor no podrá abrirlo.</p>')}
    ${paso(2,'Lista maestra → botón «+ Solicitar nuevo documento»','<p>Ahí se registra la solicitud. Es el único lugar donde nacen los documentos nuevos.</p>')}
    ${paso(3,'Llena el formulario','<p>Título, tipo, proceso, responsable, cada cuántos meses se revisa, el enlace del borrador y la justificación. El código (<span class="mono">' + esc(S.prefijo) + '-TIPO-PROCESO-NNN</span>) se asigna solo.</p>')}
    ${paso(4,'Elige quién revisa y quién aprueba','<p>Son dos personas distintas, y ninguna puedes ser tú. Al guardar, al revisor le llega un correo.</p>')}
    ${paso(5,'Sigue tu solicitud','<p>Pestaña <b>Flujo documental → Mis solicitudes</b>. Ahí ves en qué etapa está y quién la tiene.</p>')}

    <h3>C. Me toca revisar</h3>
    ${paso(1,'Flujo documental → Mis pendientes','<p>Ahí está lo que espera por ti. También te avisa el contador naranja de la pestaña.</p>')}
    ${paso(2,'Abre la solicitud y lee el borrador','<p>El borrador se ve a la izquierda; a la derecha están los datos propuestos y, si es una modificación, lo que cambió respecto de la versión vigente (resaltado en amarillo).</p>')}
    ${paso(3,'Decide','<p><b>Revisión conforme</b> la pasa al aprobador. <b>Observar</b> la devuelve al solicitante con tu comentario para que la corrija y la reenvíe.</p>')}

    <h3>D. Me toca aprobar</h3>
    ${paso(1,'Flujo documental → Mis pendientes','<p>Igual que el revisor, pero tus botones son otros.</p>')}
    ${paso(2,'Registra el respaldo de la aprobación','<p>Escribe la resolución, acta u oficio que respalda la aprobación y, si lo tienes, el enlace del PDF final firmado.</p>')}
    ${paso(3,'Aprueba','<p>Con <b>Aprobar y publicar</b> el documento entra a la lista maestra, la versión anterior pasa a obsoleta y se programa la próxima revisión. También puedes <b>Observar</b> o <b>Rechazar</b>.</p>')}

    <h3>E. Quiero cambiar o dar de baja un documento</h3>
    ${paso(1,'Ábrelo desde la Lista maestra','<p>Los botones están al pie de la ficha.</p>')}
    ${paso(2,'«Solicitar modificación» o «Solicitar anulación»','<p>La modificación crea una versión nueva (mayor si cambia el contenido, menor si es de forma). La anulación deja el documento obsoleto.</p>')}
    ${paso(3,'Mientras tanto, nadie se queda sin documento','<p>La versión vigente sigue siendo la oficial hasta que se apruebe el cambio. Verás la etiqueta «En actualización».</p>')}

    <h3>F. Quiero registrar una evidencia</h3>
    ${paso(1,'Registros y evidencias → «+ Registrar evidencia»','<p>Son las pruebas de que un formato se usó: actas, listas de asistencia, informes.</p>')}
    ${paso(2,'Elige formato, programa y periodo, y pega el enlace de Drive','<p>Indica cuántos años debe conservarse; el sistema calcula hasta cuándo y avisa al vencer.</p>')}
    ${paso(3,'Listo','<p>Las evidencias no pasan por revisión ni aprobación.</p>')}

    <h3>De dónde salen los desplegables</h3>
    <p>Cada lista desplegable muestra opciones que alguien creó antes en otro lugar. Si una opción no aparece, hay que crearla allí:</p>
    <dl class="fuente">
      <dt>Tipo de documento</dt><dd><b>Administración → Catálogos</b> → «+ Nueva opción» con categoría «Tipo de documento». (${c.tipos.length} opciones hoy)</dd>
      <dt>Programa</dt><dd><b>Administración → Catálogos</b> → «+ Nueva opción» con categoría «Programa». (${c.programas.length})</dd>
      <dt>Periodo</dt><dd><b>Administración → Catálogos</b> → «+ Nueva opción» con categoría «Periodo». (${c.periodos.length})</dd>
      <dt>Proceso</dt><dd><b>No se crea en el repositorio.</b> Se lee del <b>Inventario de Procesos de la Matriz de Indicadores</b>; se agrega allá y aparece acá. (${c.procesos.length})</dd>
      <dt>Revisor</dt><dd><b>Administración → Usuarios y roles</b> → «+ Nuevo usuario» con rol «Revisor» (o «Controlador documental»).</dd>
      <dt>Aprobador</dt><dd><b>Administración → Usuarios y roles</b> → «+ Nuevo usuario» con rol «Aprobador».</dd>
      <dt>Formato (evidencias)</dt><dd>La <b>Lista maestra</b>: aparecen los documentos vigentes de tipo Formato o Matriz.</dd>
    </dl>

    <h3>Tu acceso</h3>
    <p>Entras como <b>${esc(p.roles.join(' · '))}</b>. ${p.puede.solicitar?'Puedes iniciar solicitudes en tus procesos.':'Puedes consultar los documentos vigentes de distribución interna.'}
    ${p.puede.registrar?'Puedes registrar evidencias.':''} ${p.control?'Tienes control documental sobre todos los procesos.':''}</p>
  </div>
  <div class="modal-pie"><button class="btn" onclick="cerrarModal()">Entendido</button></div>`);
}

function mostrarAvisoVersion(v){
  const el = $('avisoVersion'); if (!el) return;
  if (S.perfil && S.perfil.admin){
    el.innerHTML = `<b>El Apps Script publicado está desactualizado</b> (${v?`versión ${esc(v)}`:'versión anterior'}; esta página necesita ${BACKEND_ESPERADO}). Por eso algunas pantallas muestran «Ruta no reconocida».<br>${PASOS_PUBLICAR}`;
  } else {
    el.innerHTML = '<b>El repositorio se está actualizando.</b> Algunas funciones pueden no estar disponibles todavía.';
  }
  el.classList.remove('oculto');
}
function ocultarAvisoVersion(){ const el = $('avisoVersion'); if (el) el.classList.add('oculto'); }

function aviso(msg, error){ const d=document.createElement('div'); d.className='toast'+(error?' error':''); d.textContent=msg; $('avisos').appendChild(d); setTimeout(()=>d.remove(), error?7000:3500); }
let cargas = 0, relojCarga = null;
function cargando(on){
  cargas = Math.max(0, cargas + (on ? 1 : -1));
  const activo = cargas > 0;
  $('carga').classList.toggle('oculto', !activo);
  clearTimeout(relojCarga);
  if (!activo){ $('cargaTexto').textContent = ''; return; }
  $('cargaTexto').textContent = '';
  relojCarga = setTimeout(() => {
    $('cargaTexto').textContent = 'Conectando con el servidor… La primera carga después de un rato sin uso puede tardar unos segundos más: Google está despertando el servicio.';
  }, 6000);
}

const pausa = ms => new Promise(r => setTimeout(r, ms));

/* Renueva el token de Google sin sacar al usuario del aplicativo.
   El token de Google dura una hora; antes esto obligaba a volver a entrar. */
let esperaCredencial = null;
function renovarSesion(){
  return new Promise(resolver => {
    if (!window.google || !google.accounts){ return resolver(false); }
    let resuelto = false;
    const terminar = v => { if (!resuelto){ resuelto = true; esperaCredencial = null; resolver(v); } };
    esperaCredencial = () => terminar(true);
    try{
      google.accounts.id.prompt(n => {
        const falla = (n.isNotDisplayed && n.isNotDisplayed()) || (n.isSkippedMoment && n.isSkippedMoment())
          || (n.isDismissedMoment && n.isDismissedMoment());
        if (falla) terminar(false);
      });
    }catch(e){ terminar(false); }
    setTimeout(() => terminar(false), 9000);
  });
}

async function api(ruta, cuerpo, intento){
  intento = intento || 0;
  cargando(true);
  try{
    const ctrl = new AbortController();
    const reloj = setTimeout(() => ctrl.abort(), 45000);
    let texto;
    try{
      const r = await fetch(CFG.API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ ruta, cred:S.cred, cuerpo: cuerpo||{} }), signal: ctrl.signal });
      texto = await r.text();
    }catch(e){
      if (e.name === 'AbortError'){
        if (intento < 1){ await pausa(800); return api(ruta, cuerpo, intento+1); }
        throw new Error('El servidor tardó demasiado en responder. Espera unos segundos y vuelve a intentar.');
      }
      if (intento < 1){ await pausa(800); return api(ruta, cuerpo, intento+1); }
      throw new Error('No se pudo conectar con el repositorio. Revisa tu conexión y vuelve a intentar.');
    }finally{ clearTimeout(reloj); }

    let d;
    try{ d = JSON.parse(texto); }
    catch(e){
      // El puente devolvió una página HTML (reinicio del Worker, tope de Google
      // o implementación del Apps Script sin acceso público). Se reintenta una vez.
      if (intento < 1){ await pausa(1200); return api(ruta, cuerpo, intento+1); }
      throw new Error('El puente respondió con una página web en lugar de datos. Suele resolverse volviendo a intentar; si persiste, revisa en el Apps Script que la implementación siga publicada con acceso «cualquier usuario».');
    }

    if (d.error && (d.rutaDesconocida || /^Ruta no reconocida/.test(d.error))){
      mostrarAvisoVersion(d.backend || '');
      throw new Error(S.perfil && S.perfil.admin
        ? 'El Apps Script publicado es una versión anterior y todavía no tiene esta función. Mira el aviso amarillo de arriba para actualizarlo.'
        : 'Esta función aún no está disponible: el repositorio se está actualizando. Intenta más tarde o avisa al administrador.');
    }
    if (d.error){
      if (/sesión venció|Sesión ausente|token/i.test(d.error)){
        if (intento < 1 && await renovarSesion()) return api(ruta, cuerpo, intento+1);
        salir(true);
      }
      throw new Error(d.error);
    }
    return d;
  } finally { cargando(false); }
}

function vistaPrevia(url){
  if(!url) return '';
  let m = /drive\.google\.com\/file\/d\/([\w-]+)/.exec(url) || /[?&]id=([\w-]+)/.exec(url);
  if (m && /google\.com/.test(url)) return `https://drive.google.com/file/d/${m[1]}/preview`;
  m = /docs\.google\.com\/(document|spreadsheets|presentation)\/d\/([\w-]+)/.exec(url);
  if (m) return `https://docs.google.com/${m[1]}/d/${m[2]}/preview`;
  return url;
}

function etiEstado(e){
  const c = {'Vigente':'e-vigente','Obsoleto':'e-obsoleto','En revisión':'e-flujo','En aprobación':'e-flujo','Observada':'e-observada','Rechazada':'e-rechazada','Aprobada':'e-vigente','Desistida':'e-neutra'}[e] || 'e-neutra';
  return `<span class="eti ${c}">${esc(e||'—')}</span>`;
}
function etiRevision(d){
  if (d.estado!=='Vigente' || !d.proximaRevision) return `<span class="sub">${fechaCorta(d.proximaRevision)}</span>`;
  const dias = diasEntre(S.hoy, d.proximaRevision);
  if (dias < 0) return `<span class="eti e-vencida">Vencida ${fechaCorta(d.proximaRevision)}</span>`;
  if (dias <= 60) return `<span class="eti e-proxima">${fechaCorta(d.proximaRevision)} · ${dias} d</span>`;
  return `<span class="sub mono">${fechaCorta(d.proximaRevision)}</span>`;
}
const procNombre = c => { const s = String(c||'').split(/\s*[›>»]\s*/).filter(x => x && !/^n\.?\/?d\.?$/i.test(x.trim()));
  if (s.length >= 2) return s[s.length-1]; return (S.cat.procesos.find(p=>p.codigo===c)||{}).nombre || c; };

/* --------------------------------------------------------------- acceso */
function iniciarGoogle(){
  if (!window.google || !google.accounts){ return setTimeout(iniciarGoogle, 200); }
  google.accounts.id.initialize({ client_id: CFG.CLIENT_ID, hd: CFG.DOMINIO, auto_select: true,
    callback: r => {
      S.cred = r.credential; sessionStorage.setItem('riid_cred', r.credential);
      if (esperaCredencial) esperaCredencial(); else entrar();
    } });
  google.accounts.id.renderButton($('botonGoogle'), { theme:'outline', size:'large', text:'signin_with', locale:'es' });
}
function salir(vencida){
  sessionStorage.removeItem('riid_cred'); S.cred='';
  if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
  $('aplicacion').classList.add('oculto'); $('pantallaAcceso').classList.remove('oculto');
  try{ pararVoz(); if (dictando && ASIS_REC) ASIS_REC.stop(); }catch(e){}
  ['asisBoton','asisPanel'].forEach(id => { const el = $(id); if (el) el.remove(); });
  ASIS.mensajes = []; ASIS.imagen = null;
  if (vencida) $('errorAcceso').textContent = 'Tu sesión de Google venció por inactividad. Vuelve a ingresar con el botón de arriba: no se perdió ninguna información.';

async function entrar(){
  $('errorAcceso').textContent='';
  try{
    await recargar();
    $('pantallaAcceso').classList.add('oculto'); $('aplicacion').classList.remove('oculto');
    $('uNombre').textContent = S.perfil.nombre;
    $('uRol').textContent = S.perfil.roles.join(' · ');
    document.querySelectorAll('#nav button').forEach(b => {
      const req = b.dataset.req;
      const ok = !req || (req==='registrado' ? S.perfil.registrado : S.perfil.puede[req]);
      b.classList.toggle('oculto', !ok);
    });
    mostrar(S.vista);
    montarAsistente();
  }catch(e){ $('errorAcceso').textContent = e.message; }
}
async function recargar(){
  const d = await api('/inicio');
  Object.assign(S, { perfil:d.perfil, cat:d.catalogos, cand:d.candidatos, docs:d.documentos, sols:d.solicitudes,
    obsAbiertas:d.observacionesAbiertas, totalReg:d.totalRegistros, hoy:d.hoy, prefijo:d.prefijo });
  S.backend = d.backend || '';
  if (S.backend < BACKEND_ESPERADO) mostrarAvisoVersion(S.backend); else ocultarAvisoVersion();
  const pend = pendientes().length;
  $('cPend').textContent = pend; $('cPend').classList.toggle('oculto', !pend);
}
$('nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) mostrar(b.dataset.vista); });
function mostrar(v){
  S.vista = v;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('activa', b.dataset.vista===v));
  ['tablero','maestra','flujo','registros','admin'].forEach(x => $('v-'+x).classList.toggle('oculto', x!==v));
  ({tablero:vTablero, maestra:vMaestra, flujo:vFlujo, registros:vRegistros, admin:vAdmin})[v]();
}

function pendientes(){
  const c = S.perfil?.correo;
  return S.sols.filter(s => (s.etapa==='En revisión' && s.correoRevisor===c) || (s.etapa==='En aprobación' && s.correoAprobador===c) || (s.etapa==='Observada' && s.correoSolicitante===c));
}
function aQuienLeToca(s){
  return s.etapa==='En revisión' ? s.revisor : s.etapa==='En aprobación' ? s.aprobador : s.etapa==='Observada' ? s.solicitante : '—';
}

/* -------------------------------------------------------- lista maestra */
function docsFiltrados(){
  const q = F.q.toLowerCase();
  return S.docs.filter(d => (!F.tipo||d.tipo===F.tipo) && (!F.macro||segsDe(d.proceso)[0]===F.macro) && (!F.proceso||d.macroproceso===F.proceso)
    && (!F.programa||d.programa===F.programa) && (!F.estado||d.estado===F.estado)
    && (!q || [d.codigo,d.titulo,d.palabras,d.responsable,d.unidad].join(' ').toLowerCase().includes(q)))
    .sort((a,b)=>a.codigo.localeCompare(b.codigo));
}

    '<b>Para leer un documento:</b> haz clic en su fila. Se abre la ficha con el archivo, sus versiones y sus observaciones.',
    S.perfil.puede.solicitar ? '<b>Para crear uno nuevo:</b> botón <b>+ Solicitar nuevo documento</b> (arriba a la derecha). Antes, sube el borrador a Drive y compártelo con urp.edu.pe.' : '<b>Para proponer un documento nuevo:</b> pídelo al responsable de tu proceso o a control documental.',

  ].filter(Boolean))}

function pintarMaestra(){

function exportarCSV(){
  const cols = [['codigo','Código'],['titulo','Título'],['tipo','Tipo'],['macroproceso','Macroproceso'],['proceso','Proceso'],['programa','Programa'],['unidad','Unidad responsable'],['responsable','Responsable'],['version','Versión'],['estado','Estado'],['fechaAprobacion','Fecha de aprobación'],['documentoAprobacion','Documento de aprobación'],['proximaRevision','Próxima revisión'],['distribucion','Distribución'],['origen','Origen']];
  const filas = [cols.map(c=>c[1])].concat(docsFiltrados().map(d=>cols.map(c=>d[c[0]]||'')));
  const csv = '\ufeff' + filas.map(f=>f.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download = `Lista_maestra_RIID_${S.hoy}.csv`; a.click();
}

/* ---------------------------------------------- cascada de procesos
   Igual que en la Matriz de Indicadores: se elige Tipo de proceso →
   Proceso nivel 0 → nivel 1 → nivel 2 → nivel 3 → Procedimiento (nivel 4),
   leyendo la «Ruta completa» del inventario. Si una rama no tiene un nivel
   (viene como N.D.), la cascada lo salta y ofrece el siguiente que exista. */
const esND = x => { const k = String(x||'').trim().toLowerCase(); return !k || k==='n.d.' || k==='nd' || k==='n/d' || k==='-'; };
function segsDe(ruta){
  const s = String(ruta||'').split(/\s*[›>»]\s*/).map(x => esND(x) ? '' : x.trim());
  while (s.length && !s[s.length-1]) s.pop();
  return s;
}
const rutaLegible = v => { const s = segsDe(v); return s.length >= 2 ? s.filter(Boolean).join(' › ') : procNombre(v); };
function codigoTramo(t){
  const m = /^([A-Za-z]{1,3}\s?\d{1,2}(?:\.\d{1,2})*)/.exec(String(t||'').trim());
  return m ? m[1].replace(/[\s.]/g,'').toUpperCase() : '';
}
const NIVELES = () => (S.cat.niveles || ['Tipo de proceso','Proceso nivel 0','Proceso nivel 1','Proceso nivel 2','Proceso nivel 3','Procedimiento (nivel 4)']);

/* Rutas que la persona puede usar: todas, o solo las de sus procesos */
function rutasPermitidas(){
  const rutas = S.cat.rutas || [];
  if (S.perfil.puede.todosLosProcesos) return rutas;
  const mios = S.perfil.procesos.map(p => p.toUpperCase().replace(/[\s.]/g,''));
  return rutas.filter(r => r.slice(1).some(t => { const c = codigoTramo(t); return c && mios.some(m => c === m || c.startsWith(m)); }));
}

let CASC = [];   // niveles elegidos: [{i: posición en la ruta, v: valor}]
function coincide(r, hasta){ return CASC.slice(0, hasta).every(e => r[e.i] === e.v); }

/* Opciones para el paso k: el primer nivel con datos después del último elegido */
function opcionesPaso(k){
  const rutas = rutasPermitidas().filter(r => coincide(r, k));
  const desde = k === 0 ? 0 : CASC[k-1].i + 1;
  for (let i = desde; i < 6; i++){
    const set = new Set();
    rutas.forEach(r => { let libre = true; for (let j = desde; j < i; j++) if (r[j]) libre = false; if (libre && r[i]) set.add(r[i]); });
    if (set.size) return { i, opciones: [...set].sort((a,b)=>a.localeCompare(b,'es',{numeric:true})) };
  }
  return null;
}

function valorCascada(){
  if (!CASC.length) return '';
  const ult = CASC[CASC.length-1].i, arr = [];
  for (let i = 0; i <= ult; i++){ const e = CASC.find(x => x.i === i); arr.push(e ? e.v : 'N.D.'); }
  return arr.join(' › ');
}

function pintarCascada(){
  const cont = $('cascProc'); if (!cont) return;
  const niv = NIVELES();
  let html = '', k = 0;
  while (true){
    const p = opcionesPaso(k);
    if (!p) break;
    const elegido = CASC[k] && CASC[k].i === p.i ? CASC[k].v : '';
    const obligatorio = p.i <= 1;
    html += `<div class="casc-nivel"><label${obligatorio?' class="req"':''}>${esc(niv[p.i])}${p.i>1?' <span class="sub">(opcional)</span>':''}</label>
      <select onchange="cambiarCascada(${k}, ${p.i}, this.value)">
        <option value="">${obligatorio?'Seleccione':'— No bajar más: el documento pertenece al nivel anterior —'}</option>
        ${p.opciones.map(o=>`<option value="${esc(o)}"${o===elegido?' selected':''}>${esc(o)}</option>`).join('')}
      </select>${k>0 && CASC[k-1] && p.i > CASC[k-1].i+1 ? `<div class="sub">Se saltó ${esc(niv.slice(CASC[k-1].i+1, p.i).join(', '))}: esta rama no tiene ese nivel.</div>`:''}</div>`;
    if (!elegido) break;
    k++;
  }
  const v = valorCascada();
  cont.innerHTML = (rutasPermitidas().length ? html : `<div class="lista-vacia">⚠ No hay procesos disponibles${S.perfil.puede.todosLosProcesos?' en el inventario':' asignados a tu usuario'}.</div>`) +
    `<div class="casc-ruta"><span class="sub">Ruta seleccionada:</span> ${v ? esc(rutaLegible(v)) : '<span class="sub">— elige al menos el tipo y el proceso nivel 0 —</span>'}</div>`;
  $('dProceso').value = v;
  previoCodigo();
}

function cambiarCascada(k, i, valor){
  CASC = CASC.slice(0, k);
  if (valor) CASC.push({ i, v: valor });
  pintarCascada();
}

function iniciarCascada(valor){
  CASC = [];
  const s = segsDe(valor);
  if (s.length >= 2) s.forEach((v, i) => { if (v) CASC.push({ i, v }); });
  // si la ruta guardada ya no existe en el inventario, se empieza de cero
  if (CASC.length && !rutasPermitidas().some(r => coincide(r, CASC.length))) CASC = [];
}

        ${campoF('Elaboró', `<input type="text" id="eElaboro">`, notaF('Quién lo redactó, si se sabe.'))}
        ${campoF('Revisó', `<input type="text" id="eReviso">`, notaF('Quién lo revisó, si se sabe.'))}
        ${campoF('Aprobó', `<input type="text" id="eAprobo">`, notaF('Autoridad que lo aprobó.'))}
        ${campoF('Enlace del documento aprobado', `<input type="url" id="eEnlace" placeholder="https://drive.google.com/file/d/...">`,

async function enviarDocumento(modo, codigo){
  try{
    if (modo==='existente'){
      const datos = Object.assign(leerCamposDocumento(), { codigo:$('eCodigo').value.trim(), version:$('eVersion').value.trim(),
        fechaAprobacion:$('eFecha').value, documentoAprobacion:$('eDocAprob').value.trim(), elaborado:$('eElaboro').value.trim(),
        revisado:$('eReviso').value.trim(), aprobado:$('eAprobo').value.trim(), enlace:$('eEnlace').value.trim() });
      const r = await api('/documento-existente', { datos });
      aviso('Registrado como vigente: ' + r.codigo); cerrarModal(); await recargar(); mostrar('maestra'); return;
    }
    const cuerpo = { tipo:modo, codigo, justificacion:$('fJust').value.trim(), correoRevisor:$('fRevisor').value, correoAprobador:$('fAprobador').value };
    if (modo!=='Anulación'){
      cuerpo.datos = leerCamposDocumento(); cuerpo.enlaceBorrador = $('fBorrador').value.trim();
      if (modo==='Modificación') cuerpo.tipoCambio = $('fCambio').value;
    }
    const r = await api('/solicitud', cuerpo);
    aviso(`Solicitud ${r.id} registrada · ${r.codigo}`); cerrarModal(); await recargar(); mostrar('flujo');
  }catch(e){ aviso(e.message, true); }
}

      <div class="campo completo"><label>Comentario</label><textarea id="aCom" placeholder="Obligatorio si observas o rechazas"></textarea>

  else if (s.etapa==='Observada' && s.correoSolicitante===c) acciones = `
    <div class="comose"><b>Tu solicitud fue observada</b><div class="finalidad">Lee la observación en el historial de arriba, corrige el borrador en Drive y pulsa <b>Reenviar a revisión</b>. Si ya no quieres seguir, pulsa <b>Desistir</b> y el trámite se cierra.</div></div>

async function accion(id, acc){
  const com = $('aCom') ? $('aCom').value.trim() : '';
  const cuerpo = { id, accion:acc, comentario:com };
  if (acc==='aprobar') cuerpo.aprobacion = { documentoAprobacion:$('aDoc').value.trim(), fecha:$('aFecha').value, enlaceFinal:$('aEnlace')?$('aEnlace').value.trim():'' };
  if (acc==='desistir' && !confirm('¿Desistir de esta solicitud? No se puede deshacer.')) return;
  if (acc==='rechazar' && !confirm('¿Rechazar y cerrar esta solicitud?')) return;
  try{ await api('/solicitud-accion', cuerpo);
    aviso({conforme:'Revisión conforme registrada',observar:'Observación enviada al solicitante',aprobar:'Aprobado: la lista maestra se actualizó',rechazar:'Solicitud rechazada',desistir:'Solicitud cerrada'}[acc]);
    cerrarModal(); await recargar(); mostrar(S.vista);
  }catch(e){ aviso(e.message, true); }
}
async function reenviar(id){
  try{ await api('/solicitud-reenviar', { id, comentario:$('aCom').value.trim(), enlaceBorrador:$('aBorrador')?$('aBorrador').value.trim():'' });
    aviso('Reenviada a revisión'); cerrarModal(); await recargar(); mostrar(S.vista); }catch(e){ aviso(e.message, true); }
}

    <td class="sub">${esc(r.registradoPor)}<br>${fechaCorta(r.fecha)}</td>
    <td><a class="btn g sm" href="${esc(r.enlace)}" target="_blank" rel="noopener">Abrir</a></td></tr>`; }).join('') : '<tr><td colspan="7" class="vacio">Sin registros con esos filtros.<br><span class="sub">Si es la primera vez, usa «+ Registrar evidencia» para cargar la primera.</span></td></tr>';
}

    ${campoF('Disposición final', `<select id="gDisp">${opciones(DISPOSICION,'Evaluar al vencer')}</select>`,

  </div></div>
  <div class="modal-pie"><button class="btn n" onclick="cerrarModal()">Cancelar</button><button class="btn" onclick="guardarRegistro()">Guardar evidencia</button></div>`);

}
async function guardarRegistro(){
  const cod = $('gFormato').value, doc = S.docs.find(d=>d.codigo===cod);
  const cuerpo = { codigoFormato: doc?cod:'', formato: doc?doc.titulo:(cod==='__otro'?$('gOtro').value.trim():''), proceso: doc?doc.proceso:'',
    programa:$('gPrograma').value, periodo:$('gPeriodo').value, descripcion:$('gDesc').value.trim(), enlace:$('gEnlace').value.trim(),
    retencion:$('gRet').value, disposicion:$('gDisp').value };
  try{ const r = await api('/registro', cuerpo); aviso('Evidencia registrada: '+r.id); cerrarModal(); S.totalReg++; vRegistros(true); }catch(e){ aviso(e.message, true); }
}

function irPrereq(cual){
  const r = PREREQ[cual]; cerrarModal();

/* Orden de llenado: qué formulario debe completarse antes que otro */
function puestaEnMarcha(){
  const c = S.cat, cand = S.cand || {revisores:[],aprobadores:[]};
  const formatos = S.docs.filter(d=>d.estado==='Vigente' && /formato|matriz/i.test(d.tipo)).length;
  const pasos = [
    { ok: cand.revisores.length>0 && cand.aprobadores.length>0, t:'1. Usuarios y roles',
      d:`Dar rol a por lo menos un revisor y un aprobador. Sin ellos, las listas «Revisor» y «Aprobador» salen vacías y nadie puede iniciar una solicitud. Hoy: ${cand.revisores.length} revisor(es), ${cand.aprobadores.length} aprobador(es).`,
      b: S.perfil.admin ? `<button class="btn g sm" onclick="abrirAdmin('usuarios')">Ir</button>` : '' },
    { ok: c.tipos.length>0 && c.programas.length>0 && c.periodos.length>0, t:'2. Catálogos',
      d:`Crear las opciones de las listas «Tipo de documento», «Programa» y «Periodo». Hoy: ${c.tipos.length} tipos, ${c.programas.length} programas, ${c.periodos.length} periodos.`,
      b: `<button class="btn g sm" onclick="abrirAdmin('catalogos')">Ir</button>` },
    { ok: c.procesos.length>0, t:'3. Inventario de procesos',
      d:`Se llena en la Matriz de Indicadores, no aquí. El repositorio lo lee para la lista «Proceso». Hoy se leen ${c.procesos.length} procesos.`, b:'' },
    { ok: S.docs.length>0, t:'4. Documentos ya aprobados',
      d:'Cargar la Política de calidad, el Alcance del SGOE, las guías y demás documentos aprobados antes del repositorio, con «Lista maestra → Registrar documento ya aprobado».',
      b: `<button class="btn g sm" onclick="mostrar('maestra')">Ir</button>` },
    { ok: formatos>0, t:'5. Formatos en la lista maestra',
      d:`Registrar los formatos (en blanco) como documentos de tipo «Formato». Las evidencias se asocian a ellos; sin formatos solo se puede usar «Otro registro». Hoy: ${formatos}.`,
      b: `<button class="btn g sm" onclick="mostrar('maestra')">Ir</button>` }
  ];
  const faltan = pasos.filter(p=>!p.ok).length;
  return { faltan, html: `<div class="marcha"><h3>Puesta en marcha · orden de llenado ${faltan?`<span class="eti e-observada">${faltan} pendiente(s)</span>`:'<span class="eti e-vigente">Completa</span>'}</h3>
    <div class="sub">Cada paso alimenta las listas del siguiente, por eso conviene llenarlos en este orden.</div>
    ${pasos.map(p=>`<div class="paso-m"><div class="ic ${p.ok?'ok':'no'}">${p.ok?'✓':'!'}</div><div class="tx"><b>${p.t}</b><span>${p.d}</span></div>${p.ok?'':p.b}</div>`).join('')}
  </div>` };
}

function verFilaAdmin(t, recordId){

  const valor = (c, v) => {
    if (c === 'Historial'){ const h = (()=>{ try{ return JSON.parse(v||'[]'); }catch(e){ return []; } })();

}

/* Formulario de alta o edición */
function formAdmin(t, recordId){
  const f = FICHAS[t], d = S.adm[t], fila = recordId ? d.filas.find(x=>x.recordId===recordId) : {};
  const nuevo = !recordId;
  const control = (col, spec, i) => {
    const v = fila[col] !== undefined && fila[col] !== '' ? fila[col] : (spec.defecto || (col==='Categoría' && filtroAdmin.categoria) || '');
    const id = 'adm_'+i;
    if (spec.tipo === 'lista') return `<select id="${id}">${opciones(spec.opciones, v, 'Seleccione')}</select>`;
    if (spec.tipo === 'catalogo') return `<select id="${id}">${opciones(S.cat[spec.categoria].map(x=>x.nombre), v, 'Seleccione')}</select>`;
    if (spec.tipo === 'area') return `<textarea id="${id}">${esc(v)}</textarea>`;
    if (spec.tipo === 'procesos'){
      const marcados = v.split(/[,;]/).map(x=>x.trim().toUpperCase()).filter(Boolean);
      const raices = S.cat.procesos.filter(p => (p.nivel||0) === 0);
      return `<div class="chips" id="${id}"><label><input type="checkbox" value="Todos" ${marcados.includes('TODOS')?'checked':''}>Todos</label>
        ${raices.map(p=>`<label title="${esc(p.nombre)}"><input type="checkbox" value="${esc(p.codigo)}" ${marcados.includes(p.codigo.toUpperCase())?'checked':''}>${esc(p.codigo)} · ${esc(p.nombre)}</label>`).join('')}</div>`;
    }
    const tipoInput = {numero:'number', correo:'email', url:'url'}[spec.tipo] || 'text';
    return `<input type="${tipoInput}" id="${id}" value="${esc(v)}"${spec.tipo==='numero'?' min="0" step="1"':''}>`;
  };
  const notaDe = (col, spec) => {
    if (spec.nota === 'rol') return `<div class="nota-campo">${Object.entries(DESC_ROLES).map(([r,x])=>`<div><b>${esc(r)}:</b> ${esc(x)}</div>`).join('')}</div>`;
    if (spec.nota && spec.nota.startsWith('origen:')) return origenLista(spec.nota.slice(7));
    return `<div class="nota-campo">${spec.nota || esc((DICC[t]||{})[col] || '')}</div>`;
  };
  const cols = Object.keys(f.campos);
  modal(`<div class="modal-cab"><div style="flex:1"><div class="sub">${esc(f.titulo)}</div><h2>${nuevo?(f.nombreFila==='usuario'?'Nuevo ':'Nueva ')+esc(f.nombreFila):'Editar '+esc(f.nombreFila)}</h2></div><button class="cerrar" onclick="cerrarModal()">×</button></div>
  <div class="modal-cuerpo">
    <div class="comose"><b>Para qué sirve este formulario</b><div class="finalidad">${f.finalidad}</div></div>
    ${f.soloVer && !nuevo ? `<dl class="meta" style="margin-bottom:14px">${f.soloVer.map(c=>`<dt>${esc(c)}</dt><dd>${esc(fila[c]||'—')}</dd>`).join('')}</dl>` : ''}
    <div class="campos">${cols.map((c,i) => { const spec = f.campos[c];
      const ancho = ['area','procesos'].includes(spec.tipo) || spec.nota==='rol' || /Enlace|Objetivo/.test(c);
      return `<div class="campo${ancho?' completo':''}"><label${spec.req?' class="req"':''}>${esc(c)}</label>${control(c,spec,i)}${notaDe(c,spec)}</div>`; }).join('')}</div>
  </div>
  <div class="modal-pie"><span class="sub" style="margin-right:auto;align-self:center">El cambio queda registrado en la bitácora con el valor anterior y el nuevo.</span>
    <button class="btn n" onclick="cerrarModal()">Cancelar</button><button class="btn" onclick="guardarAdmin('${t}','${esc(recordId||'')}')">Guardar</button></div>`);
}

async function guardarAdmin(t, recordId){
  const f = FICHAS[t], datos = {};
  Object.keys(f.campos).forEach((c,i) => {
    const el = $('adm_'+i);
    if (f.campos[c].tipo === 'procesos'){
      const m = [...el.querySelectorAll('input:checked')].map(x=>x.value);
      datos[c] = m.includes('Todos') ? 'Todos' : m.join(', ');
    } else datos[c] = el.value;
  });
  try{
    const r = await api('/admin-guardar', { tabla:t, recordId, datos });
    aviso(r.sinCambios ? 'No había cambios que guardar' : 'Guardado');
    cerrarModal();
    if (['catalogos','usuarios','documentos'].includes(t)) await recargar();
    vAdmin();
  }catch(e){ aviso(e.message, true); }
}

/* ------------------------------------------------------ asistente de IA
   Botón «💬 Ayuda» con panel de chat. Habla con el Worker asistente-riid,
   que responde sobre el uso del repositorio y sobre información documentada.
   Acepta capturas con 📎 o pegándolas con Ctrl+V. */
const ASIS = { mensajes: [], imagen: null, ocupado: false, ultimo: null };
const PESTANAS = { tablero:'Tablero', maestra:'Lista maestra', flujo:'Flujo documental', registros:'Registros y evidencias', admin:'Administración' };

function mdSimple(t){
  let h = esc(t);
  h = h.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, '$1<i>$2</i>').replace(/_\((.+?)\)_/g, '<i>($1)</i>');
  h = h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/([\w.+-]+@[\w-]+\.[\w.]+)/g, '<a href="mailto:$1">$1</a>');
  const lineas = h.split('\n'); let out = '', lista = null;
  const cerrar = () => { if (lista){ out += `</${lista}>`; lista = null; } };
  for (const l of lineas){
    let m;
    if ((m = /^\s*\d+[.)]\s+(.*)$/.exec(l))){ if (lista!=='ol'){ cerrar(); out += '<ol>'; lista='ol'; } out += `<li>${m[1]}</li>`; }
    else if ((m = /^\s*[-•*]\s+(.*)$/.exec(l))){ if (lista!=='ul'){ cerrar(); out += '<ul>'; lista='ul'; } out += `<li>${m[1]}</li>`; }
    else if ((m = /^#{1,4}\s+(.*)$/.exec(l))){ cerrar(); out += `<p><b>${m[1]}</b></p>`; }
    else if (!l.trim()){ cerrar(); }
    else { cerrar(); out += `<p>${l}</p>`; }
  }
  cerrar(); return out;
}

function montarAsistente(){
  if ($('asisBoton') || !CFG.ASISTENTE_URL) return;
  const b = document.createElement('button');
  b.id = 'asisBoton'; b.className = 'asis-boton'; b.innerHTML = '💬 Ayuda';
  b.onclick = () => { if ($('asisPanel').classList.contains('oculto')){ $('asisPanel').classList.remove('oculto'); $('asisTexto').focus(); } else cerrarAsistente(); };
  document.body.appendChild(b);
  const p = document.createElement('div');
  p.id = 'asisPanel'; p.className = 'asis-panel oculto';
  p.innerHTML = `
    <div class="asis-cab"><div><b>Asistente del RIID</b><span>Uso del repositorio e información documentada ISO 21001</span></div>
      <button class="asis-voz" id="asisVoz" title="Lectura en voz alta: apagada" onclick="alternarVoz()">🔇</button>
      <button class="cerrar" onclick="cerrarAsistente()">×</button></div>
    <div class="asis-cuerpo" id="asisCuerpo">
      <div class="asis-msg asistente"><p>Hola. Puedo ayudarte a <b>usar el repositorio</b> (dónde está cada botón, qué poner en cada campo, de dónde salen las listas) y también con el <b>contenido</b>: cómo redactar un procedimiento, qué revisar antes de aprobar, cuánto conservar un registro o qué pide la cláusula 7.5.</p>
      <p>Si algo no te sale, pégame una captura de pantalla con <b>Ctrl+V</b> o con el clip 📎. También puedes <b>dictar</b> tu pregunta con 🎙️ y activar la <b>lectura en voz alta</b> con el altavoz de arriba.</p></div>
      <div class="asis-sugeridas">${['¿Cómo pido un documento nuevo?','¿De dónde salen las listas desplegables?','¿Qué diferencia hay entre documento y registro?','¿Qué reviso antes de dar conformidad?']
        .map(t=>`<button onclick="preguntarAsistente(${JSON.stringify(t).replace(/"/g,'&quot;')})">${esc(t)}</button>`).join('')}</div>
    </div>
    <div class="asis-adjunto oculto" id="asisAdjunto"><img id="asisMini" alt=""><span>Captura adjunta</span><button onclick="quitarImagen()">Quitar</button></div>
    <div class="asis-pie">
      <label class="asis-clip" title="Adjuntar captura">📎<input type="file" accept="image/*" id="asisArchivo" hidden></label>
      <button class="asis-mic oculto" id="asisMic" title="Dictar la pregunta" onclick="alternarDictado()">🎙️</button>
      <textarea id="asisTexto" rows="2" placeholder="Escribe o dicta tu pregunta…" title="Enter envía · Shift+Enter hace un salto de línea"></textarea>
      <button class="btn" id="asisEnviar" onclick="enviarAsistente()">Enviar</button>
    </div>
    <div class="asis-nota">Responde con base en el manual del RIID. Puede equivocarse: verifica lo importante en la ficha del documento o con control documental. El dictado y la voz los procesa tu propio navegador: el audio no se envía al asistente.</div>`;
  document.body.appendChild(p);
  $('asisTexto').addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); enviarAsistente(); } });
  $('asisTexto').addEventListener('paste', e => {
    const it = [...(e.clipboardData||{}).items||[]].find(x => x.type && x.type.startsWith('image/'));
    if (it){ e.preventDefault(); cargarImagen(it.getAsFile()); }
  });
  $('asisArchivo').onchange = e => { if (e.target.files[0]) cargarImagen(e.target.files[0]); e.target.value=''; };
  if (window.SpeechRecognition || window.webkitSpeechRecognition) $('asisMic').classList.remove('oculto');
  if (!('speechSynthesis' in window)) $('asisVoz').classList.add('oculto');
}

/* ---------------- dictado (voz → texto) ----------------
   Lo hace el navegador (Chrome y Edge). Lo dictado aparece en el cuadro
   de texto para corregirlo antes de enviar; no se envía solo. */
let ASIS_REC = null, dictando = false;
function avisoAsistente(t){
  const d = pintarMensaje('asistente', `<p>${esc(t)}</p>`, 'error');
  setTimeout(() => { if (d && d.parentElement) d.remove(); }, 9000);
}
function alternarDictado(){
  if (dictando){ try{ ASIS_REC && ASIS_REC.stop(); }catch(e){} return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return avisoAsistente('Tu navegador no permite dictar. Usa Chrome o Edge.');
  pararVoz();
  ASIS_REC = new SR();
  ASIS_REC.lang = 'es-PE'; ASIS_REC.interimResults = true; ASIS_REC.continuous = false;
  const base = $('asisTexto').value.trim();
  ASIS_REC.onstart = () => { dictando = true; $('asisMic').classList.add('escuchando'); $('asisMic').title = 'Escuchando… pulsa para detener'; };
  ASIS_REC.onresult = ev => {
    let txt = '';
    for (let i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
    $('asisTexto').value = (base ? base + ' ' : '') + txt.trim();
  };
  ASIS_REC.onend = () => { dictando = false; $('asisMic').classList.remove('escuchando'); $('asisMic').title = 'Dictar la pregunta'; $('asisTexto').focus(); };
  ASIS_REC.onerror = ev => {
    // Cada fallo tiene una causa y una solución distintas: decirlo evita que
    // la persona crea que el dictado no funciona.
    const M = {
      'not-allowed':'El navegador bloqueó el micrófono. Pulsa el candado de la barra de direcciones y permite el micrófono para este sitio.',
      'service-not-allowed':'Windows no está dejando usar el micrófono. Revisa Configuración › Privacidad › Micrófono y activa el acceso para las aplicaciones de escritorio.',
      'no-speech':'No se escuchó nada. Acércate al micrófono y vuelve a intentarlo.',
      'audio-capture':'No se encontró ningún micrófono conectado.',
      'network':'El dictado necesita conexión a internet y no pudo alcanzar el servicio de voz del navegador.',
      'aborted':''
    };
    const t = M[ev.error];
    if (t === undefined) avisoAsistente('El dictado falló: ' + ev.error);
    else if (t) avisoAsistente(t);
  };
  // Se pide el micrófono antes de empezar: el navegador muestra el aviso de
  // permiso y sabemos si el equipo lo tiene disponible.
  const arrancar = () => { try{ ASIS_REC.start(); }catch(e){ avisoAsistente('No se pudo iniciar el dictado: ' + e.message); } };
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({ audio:true })
      .then(st => { st.getTracks().forEach(t => t.stop()); arrancar(); })
      .catch(err => {
        if (err && err.name === 'NotAllowedError') avisoAsistente('No se dio permiso al micrófono. Pulsa el candado de la barra de direcciones y permítelo para este sitio.');
        else if (err && err.name === 'NotFoundError') avisoAsistente('No se detectó ningún micrófono en este equipo.');
        else avisoAsistente('No se pudo acceder al micrófono: ' + (err && err.name || 'error'));
      });
  } else arrancar();
}

/* ---------------- lectura en voz alta (texto → voz) ----------------
   Empieza apagada: en una oficina compartida cada quien decide. */
let vozActiva = false, mensajeLeyendo = null;
function alternarVoz(){
  vozActiva = !vozActiva;
  $('asisVoz').textContent = vozActiva ? '🔊' : '🔇';
  $('asisVoz').title = 'Lectura en voz alta: ' + (vozActiva ? 'activada' : 'apagada');
  $('asisVoz').classList.toggle('activa', vozActiva);
  if (!vozActiva) pararVoz();
}
function vozEspanol(){
  const v = speechSynthesis.getVoices();
  return v.find(x => /es[-_]PE/i.test(x.lang)) || v.find(x => /es[-_](419|MX|US|CO|CL|AR)/i.test(x.lang)) || v.find(x => /^es/i.test(x.lang)) || null;
}
function textoLimpio(t){
  return String(t).replace(/\*\*|__|_\(|\)_/g,'').replace(/^\s*#{1,4}\s*/gm,'').replace(/^\s*[-•*]\s+/gm,'').replace(/^\s*(\d+)[.)]\s+/gm,'$1. ')
    .replace(/https?:\/\/\S+/g,'el enlace').replace(/[«»]/g,'').replace(/\s*→\s*/g,', luego ').replace(/[ \t]{2,}/g,' ').replace(/\s+\n/g,'\n');
}
function leerEnVoz(texto, nodo){
  if (!vozActiva || !('speechSynthesis' in window)) return;
  pararVoz();
  const u = new SpeechSynthesisUtterance(textoLimpio(texto));
  const v = vozEspanol(); if (v) u.voice = v;
  u.lang = v ? v.lang : 'es-PE'; u.rate = 1.02;
  mensajeLeyendo = nodo; if (nodo) nodo.classList.add('leyendo');
  u.onend = u.onerror = () => { if (mensajeLeyendo) mensajeLeyendo.classList.remove('leyendo'); mensajeLeyendo = null; };
  speechSynthesis.speak(u);
}
function pararVoz(){
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (mensajeLeyendo) mensajeLeyendo.classList.remove('leyendo'); mensajeLeyendo = null;
}
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
function cerrarAsistente(){
  pararVoz();
  if (dictando){ try{ ASIS_REC.stop(); }catch(e){} }
  $('asisPanel').classList.add('oculto');
}

/* Reduce la captura en el navegador (máx. 1400 px, JPEG) antes de enviarla */
function cargarImagen(archivo){
  const lector = new FileReader();
  lector.onload = () => {
    const img = new Image();
    img.onload = () => {
      const esc_ = Math.min(1, 1400 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*esc_); c.height = Math.round(img.height*esc_);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const url = c.toDataURL('image/jpeg', 0.82);
      ASIS.imagen = { mime:'image/jpeg', datos:url.split(',')[1] };
      $('asisMini').src = url; $('asisAdjunto').classList.remove('oculto');
    };
    img.src = lector.result;
  };
  lector.readAsDataURL(archivo);
}
function quitarImagen(){ ASIS.imagen = null; $('asisAdjunto').classList.add('oculto'); }

function pintarMensaje(rol, html, extra){
  const d = document.createElement('div');
  d.className = 'asis-msg ' + rol + (extra ? ' '+extra : '');
  d.innerHTML = html;
  const sug = document.querySelector('.asis-sugeridas'); if (sug) sug.remove();
  $('asisCuerpo').appendChild(d); $('asisCuerpo').scrollTop = $('asisCuerpo').scrollHeight;
  return d;
}

function preguntarAsistente(t){ $('asisTexto').value = t; enviarAsistente(); }

async function enviarAsistente(reintento){
  if (ASIS.ocupado) return;
  if (dictando){ try{ ASIS_REC.stop(); }catch(e){} }
  pararVoz();
  let texto, imagen;
  if (reintento && ASIS.ultimo){ ({ texto, imagen } = ASIS.ultimo); }
  else {
    texto = $('asisTexto').value.trim();
    imagen = ASIS.imagen;
    if (!texto && !imagen) return;
    if (!texto) texto = '¿Qué ves en esta captura y qué debo hacer?';
    ASIS.mensajes.push({ rol:'usuario', texto });
    pintarMensaje('usuario', esc(texto).replace(/\n/g,'<br>') + (imagen ? '<div class="sub">📎 captura adjunta</div>' : ''));
    $('asisTexto').value = ''; quitarImagen();
    ASIS.ultimo = { texto, imagen };
  }
  ASIS.ocupado = true; $('asisEnviar').disabled = true;
  const espera = pintarMensaje('asistente', '<span class="asis-escribiendo">Pensando…</span>');
  try{
    const ctrl = new AbortController(); const reloj = setTimeout(() => ctrl.abort(), 80000);
    const r = await fetch(CFG.ASISTENTE_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, signal: ctrl.signal,
      body: JSON.stringify({ mensajes: ASIS.mensajes, imagen,
        contexto: { pestana: PESTANAS[S.vista] || S.vista, roles: (S.perfil?.roles||[]).join(', '), nombre: S.perfil?.nombre } }) });
    clearTimeout(reloj);
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    espera.remove();
    ASIS.mensajes.push({ rol:'asistente', texto: d.respuesta });
    const nodo = pintarMensaje('asistente', mdSimple(d.respuesta));
    leerEnVoz(d.respuesta, nodo);
    ASIS.ultimo = null;
  }catch(e){
    espera.remove();
    const msg = e.name === 'AbortError' ? 'El asistente tardó demasiado en responder.' : (e.message || 'No se pudo conectar con el asistente.');
    pintarMensaje('asistente', `<p>${esc(msg)}</p><button class="btn sm" onclick="this.parentElement.remove();enviarAsistente(true)">Reintentar</button>`, 'error');
  }finally{ ASIS.ocupado = false; $('asisEnviar').disabled = false; }
}

/* --------------------------------------------------------------- arranque */
document.addEventListener('keydown', e => { if (e.key==='Escape') cerrarModal(); });
setInterval(() => { if (S.cred) renovarSesion(); }, 40*60*1000);   // el token de Google dura 1 hora
(function(){
  const c = sessionStorage.getItem('riid_cred');
  if (c){ S.cred = c; entrar(); }
  iniciarGoogle();
})();
</script>
